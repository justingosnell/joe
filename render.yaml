services:
  - type: web
    name: roadsidemap
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npx tsx server/migrate.ts && npm run merge-data && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        sync: false
      - key: SESSION_SECRET
        sync: false
    nixpacks:
      aptPackages:
        - build-essential
        - python3