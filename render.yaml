services:
  - type: web
    name: roadsidemap
    env: node
    plan: starter
    buildCommand: npm install && npx esbuild server/index.ts --platform=node --packages=external --bundle --format=esm --outdir=dist
    startCommand: npx tsx server/migrate.ts && npm run merge-data && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: BACKEND_ONLY
        value: "true"
    nixpacks:
      aptPackages:
        - build-essential
        - python3